title: avand.fm
markdown: kramdown

# Jekyll publishes everything it is not told to leave out, which for this repo
# means several directories of tooling and working files.
#
# video/ is the loud one. Tracked, it is a handful of build scripts and a
# README; on a machine that has built the ladder it is also video/src and
# video/dist, which together run to gigabytes of camera masters and
# renditions. Those are gitignored, so a GitHub Pages build never sees them --
# but a local `bin/dev` did, and copied all of it into _site on every build.
# The renditions are served from R2 in preview exactly as in production, so
# none of it belongs in the site either way.
# apps-script/ is the signup endpoint's source, deployed to Google by
# bin/apps-script, not served from here. Left in, Jekyll copied it to
# _site and GitHub Pages served it: https://avand.fm/headroom/signup.gs
# returned the whole file. Nothing secret was in it -- the repo is public and
# the API key lives in Script Properties -- but a marketing site handing out
# its backend as a download is not a thing to leave working.
# headroom/chatgpt-ad-images/ is the ad creative itself. No page links to it --
# the files are uploaded to the ad account by hand -- so serving it only means
# publishing a browsable folder of every image the campaign has ever run.
exclude:
  - README.md
  - bin
  - apps-script
  - headroom/fathom
  - headroom/openai-ad-data
  - video
  - mise.toml
  - Gemfile
  - Gemfile.lock
  - vendor

# The cohort's own facts, in one place because they are said in several.
#
# The seat count appears in the hero, in "How it works", and in the call to
# action; the dates appear there and in the application's commitment question.
# Written out at each site, changing "10 spots left" to "3 spots left" is a
# hunt through two files with nothing to say when one is missed.
#
# seats_left is the one that has to be maintained by hand, and it is the one
# that lies if it is not. Two rules for it: it only ever goes down, and it is
# never equal to `seats` -- a course advertised as twelve students with twelve
# spots remaining is telling the reader that nobody has signed up.
headroom:
  term: Fall 2026
  seats: 12
  seats_left: 10
  applications_close: September 24
  cohort_starts: October 1
